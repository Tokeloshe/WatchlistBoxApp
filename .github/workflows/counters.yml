# Counts the downloads once an hour and publishes the README's counter badges as files on the
# "counters" branch (one commit, replaced each time), so that the page never waits on a badge
# service: .github/counters.py.
name: counters

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

concurrency:
  group: counters
  cancel-in-progress: false

jobs:
  counters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count the downloads and draw the badges
        run: python3 .github/counters.py out
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish them on the counters branch
        run: |
          cd out
          git init -q -b counters
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "download counters at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" counters
        env:
          GITHUB_TOKEN: ${{ github.token }}
